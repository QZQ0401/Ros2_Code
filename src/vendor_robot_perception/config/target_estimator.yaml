target_estimator:
  ros__parameters:

    # ========================================================
    # ROS
    # ========================================================

    use_sim_time: true

    # Gazebo深度相机输出
    input_cloud_topic: /depth_camera/points

    # 最终目标统一转换到该坐标系
    # 与你当前PlanningScene中的gazebo_work_table保持一致
    output_frame: world

    # MoveIt中最终使用的目标名称
    target_id: vision_target


    # ========================================================
    # 点云处理频率
    # ========================================================

    # 相机本身30Hz，没有必要每帧都做RANSAC+聚类
    processing_rate: 10.0


    # ========================================================
    # 深度ROI
    #
    # depth_camera_optical_frame:
    #
    # X: 图像右
    # Y: 图像下
    # Z: 相机前方
    # ========================================================

    min_depth: 0.12
    max_depth: 2.0


    # ========================================================
    # VoxelGrid
    # ========================================================

    # 4mm体素比较适合当前50mm方块
    voxel_leaf_size: 0.004


    # ========================================================
    # RANSAC桌面检测
    # ========================================================

    # 离平面8mm以内认为属于桌面
    plane_distance_threshold: 0.008

    plane_max_iterations: 150

    # 桌面至少应该拥有这么多点
    plane_min_inliers: 300


    # ========================================================
    # Euclidean Cluster
    # ========================================================

    # 点之间2cm以内认为可能属于同一个物体
    cluster_tolerance: 0.018

    min_cluster_size: 60

    max_cluster_size: 30000


    # ========================================================
    # 目标尺寸的宽松过滤
    #
    # 这不是告诉算法“方块是5cm”。
    # 只是排除机器人、桌面边缘以及极小噪声。
    # ========================================================

    min_planar_dimension: 0.015
    max_planar_dimension: 0.25

    min_object_height: 0.015
    max_object_height: 0.25


    # ========================================================
    # 目标选择
    #
    # 当前只有一个抓取目标，因此优先选择
    # 最接近相机光轴中心的合法cluster。
    # ========================================================

    max_axis_ratio: 0.8


    # ========================================================
    # 稳定滤波
    # ========================================================

    # EMA:
    #
    # 越小越平滑，但延迟越大
    smoothing_alpha: 0.30

    # 连续帧之间位置变化小于5mm
    stable_position_threshold: 0.005

    # 尺寸变化小于8mm
    stable_size_threshold: 0.008

    # 连续5帧满足条件后认为目标稳定
    stable_frames: 5

    # 超过0.5s检测不到目标后删除PlanningScene目标
    target_lost_timeout: 0.5


    # ========================================================
    # MoveIt PlanningScene
    # ========================================================

    publish_to_planning_scene: true

    # 不需要每秒更新10次PlanningScene
    scene_update_rate: 2.0

    # 给视觉尺寸增加3mm碰撞余量
    collision_padding: 0.003


    # ========================================================
    # TF
    # ========================================================

    tf_timeout: 0.1
