multi_camera_cloud_fusion:
  ros__parameters:
    use_sim_time: true

    # 两台 Gazebo 深度相机原始点云。
    # 目标识别使用原始点云融合，不使用 MoveIt filtered_points；
    # filtered_points 还会屏蔽 PlanningScene 中的世界物体，
    # 容易造成 vision_target 被识别后又从感知输入中消失。
    input_topic_1: /workspace_camera/points
    input_topic_2: /workspace_camera_2/points

    target_frame: world
    output_topic: /workspace/merged_points

    # 用于 RViz 直接检查两台相机转换到 world 后是否重合。
    publish_debug_clouds: true
    debug_topic_1: /workspace/camera_1_world
    debug_topic_2: /workspace/camera_2_world

    sync_queue_size: 10
    sync_slop: 0.08
    tf_timeout: 0.20

    # 先做一个较粗的工作区裁剪，避免地面和远处场景进入融合点云。
    crop_to_workspace: true
    workspace_min_x: -1.10
    workspace_max_x: 1.10
    workspace_min_y: 0.25
    workspace_max_y: 1.15
    workspace_min_z: 0.76
    workspace_max_z: 1.45

    # 5 cm 目标使用 3 mm 体素，可保留较好的边缘尺寸信息。
    voxel_leaf_size: 0.003


target_estimator:
  ros__parameters:
    use_sim_time: true

    # 双相机融合结果已经位于 world。
    input_cloud_topic: /workspace/merged_points
    input_is_fused_cloud: true
    output_frame: world

    # 只用于多 cluster 的优先级评分，不参与 pose / size 计算。
    selection_frame: workspace_camera_optical_frame

    target_id: vision_target
    processing_rate: 10.0

    # fused 模式不会使用 optical-frame 深度过滤，
    # 这里保留用于以后切回单相机模式。
    min_depth: 0.12
    max_depth: 3.0

    # 当前抓取区域（桌面右侧）：
    # - 排除左侧 placement_bin；
    # - 排除 x≈0.2 的 obstacle_box；
    # - 避免放置后的物体再次被当作待抓取目标。
    workspace_min_x: 0.30
    workspace_max_x: 1.05
    workspace_min_y: 0.35
    workspace_max_y: 1.05
    workspace_min_z: 0.79
    workspace_max_z: 1.15

    voxel_leaf_size: 0.003

    # Gazebo 理想深度数据下使用较紧的桌面阈值。
    plane_distance_threshold: 0.004
    plane_max_iterations: 150
    plane_min_inliers: 250
    plane_max_tilt_deg: 10.0

    # 两视角在边缘处可能存在数毫米差异，聚类阈值略放宽。
    cluster_tolerance: 0.012
    min_cluster_size: 50
    max_cluster_size: 30000

    min_planar_dimension: 0.015
    max_planar_dimension: 0.20
    min_object_height: 0.015
    max_object_height: 0.20

    max_axis_ratio: 0.8

    pca_anisotropy_threshold: 0.15
    planar_percentile_low: 0.02
    planar_percentile_high: 0.98

    # 每个输入帧已经包含两个视角，因此只保留少量时间融合，
    # 避免机器人移动时产生明显拖影。
    fusion_frames: 3
    fusion_max_age: 0.50

    # 几何估计直接使用融合点云，EMA 不再负责“修正”几何误差。
    smoothing_alpha: 1.0

    stable_position_threshold: 0.005
    stable_size_threshold: 0.008
    stable_frames: 5
    target_lost_timeout: 0.8

    publish_to_planning_scene: true
    scene_update_rate: 2.0
    collision_padding: 0.003

    tf_timeout: 0.20