controller_manager:
  ros__parameters:
    update_rate: 250
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    gripper_controller:
      type: position_controllers/GripperActionController
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

arm_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    open_loop_control: false
    allow_integration_in_goal_trajectories: true
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 2.0
      joint1: { trajectory: 0.05, goal: 0.05 }
      joint2: { trajectory: 0.05, goal: 0.05 }
      joint3: { trajectory: 0.05, goal: 0.05 }
      joint4: { trajectory: 0.05, goal: 0.05 }
      joint5: { trajectory: 0.05, goal: 0.05 }
      joint6: { trajectory: 0.05, goal: 0.05 }

gripper_controller:
  ros__parameters:
    joint: gripper_left_joint
  command_interfaces:
    - position
    - velocity
  state_interfaces:
    - position
    - velocity 
    # 最大允许夹紧力
  max_effort: 3.0
   # 允许夹爪因为物体阻挡而停止
  allow_stalling: true
  #判断夹爪基本停止的速度阈值
  stalled_velocity_tolerance: 0.01
   # 连续稳定多久后认为夹爪已经stall
  stalled_timeout: 0.5
   # 位置误差容许范围
  position_tolerance: 0.01
