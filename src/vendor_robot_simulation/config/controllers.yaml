controller_manager:
  ros__parameters:
    update_rate: 250
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    gripper_controller:
      type: position_controllers/GripperActionController
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
arm_controller:
  ros__parameters:
    joints: [joint1, joint2, joint3, joint4, joint5, joint6]
    command_interfaces: [position]
    state_interfaces: [position, velocity]

    
    state_publish_rate: 50.0
    action_monitor_rate: 20.0

    allow_partial_joints_goal: false
    open_loop_control: false
    allow_integration_in_goal_trajectories: true

    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 1.0

      joint1:
        trajectory: 0.2
        goal: 0.1
      joint2:
        trajectory: 0.2
        goal: 0.1
      joint3:
        trajectory: 0.2
        goal: 0.1
      joint4:
        trajectory: 0.2
        goal: 0.1
      joint5:
        trajectory: 0.2
        goal: 0.1
      joint6:
        trajectory: 0.2
        goal: 0.1

gripper_controller:
  ros__parameters:
    joint: gripper_left_joint

# Publish only actuated coordinates.  The right gripper guide is a URDF mimic
# and MoveIt derives its state from gripper_left_joint; publishing Gazebo's
# internal mimic state would introduce a joint name absent from the URDF.
joint_state_broadcaster:
  ros__parameters:
    # Publish raw hardware state on /joint_state_broadcaster/joint_states.
    # The launch-side filter forwards only URDF joint names to /joint_states.
    use_local_topics: true
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
      - gripper_left_joint
      - left_wheel_joint
      - right_wheel_joint
      - caster_swivel_joint
      - caster_wheel_joint
